<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 720" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="tfCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c4ee5" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#844feb" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="cloudGcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cloudAwsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cloudAzureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9" />
    </linearGradient>
    
    <!-- Neon Border Gradients -->
    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#844feb" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="gcpBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="awsBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="azureBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    
    <!-- Component Gradients -->
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Shadows & Glows -->
    <filter id="glowPurple" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="475" y="40" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="1">TERRAFORM MULTI-CLOUD DEPLOYMENT ARCHITECTURE</text>
  <text x="475" y="60" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="400">Declarative Infrastructure as Code (IaC) Lifecycle across GCP, AWS &amp; Azure</text>

  <!-- ================= LEFT: INPUTS & CONFIGURATIONS ================= -->
  <g transform="translate(40, 100)">
    <!-- Section Border -->
    <rect width="240" height="380" rx="10" fill="#111827" fill-opacity="0.5" stroke="#374151" stroke-width="1.5" />
    <text x="120" y="25" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="0.5">1. CONFIGURATIONS &amp; STATE</text>
    
    <!-- TF Files Card -->
    <g transform="translate(15, 45)">
      <rect width="210" height="90" rx="8" fill="url(#compGrad)" stroke="#4b5563" stroke-width="1.5" />
      <text x="20" y="30" fill="#f8fafc" font-size="12" font-weight="700">Terraform Code (.tf)</text>
      <text x="20" y="52" fill="#64748b" font-size="10">main.tf / variables.tf</text>
      <text x="20" y="68" fill="#64748b" font-size="10">outputs.tf / providers.tf</text>
      <!-- Small tf icon -->
      <polygon points="180,25 195,17 195,33 180,41" fill="#844feb" />
      <polygon points="180,45 195,37 195,53 180,61" fill="#844feb" />
    </g>

    <!-- Variable Definitions -->
    <g transform="translate(15, 155)">
      <rect width="210" height="90" rx="8" fill="url(#compGrad)" stroke="#4b5563" stroke-width="1.5" />
      <text x="20" y="30" fill="#f8fafc" font-size="12" font-weight="700">Variables &amp; Secrets</text>
      <text x="20" y="52" fill="#64748b" font-size="10">terraform.tfvars</text>
      <text x="20" y="68" fill="#64748b" font-size="10">System Environment Variables</text>
    </g>

    <!-- State File Card -->
    <g transform="translate(15, 265)">
      <rect width="210" height="95" rx="8" fill="url(#compGrad)" stroke="#4b5563" stroke-width="1.5" />
      <text x="20" y="30" fill="#f8fafc" font-size="12" font-weight="700">Terraform State</text>
      <text x="20" y="52" fill="#64748b" font-size="10">terraform.tfstate (JSON)</text>
      <text x="20" y="68" fill="#844feb" font-size="10" font-weight="600">Locked GCS / S3 Backend</text>
    </g>
  </g>

  <!-- ================= MIDDLE: TERRAFORM CORE ENGINE ================= -->
  <g transform="translate(340, 100)">
    <rect width="270" height="380" rx="12" fill="url(#tfCoreGrad)" stroke="url(#purpleBorder)" stroke-width="2" filter="url(#glowPurple)" />
    <text x="135" y="30" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800" letter-spacing="1">TERRAFORM CORE ENGINE</text>
    
    <!-- Parser / Graph Builder -->
    <g transform="translate(20, 60)">
      <rect width="230" height="85" rx="8" fill="#1e1b4b" stroke="#844feb" stroke-width="1.5" />
      <text x="115" y="30" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Parser &amp; Interpolator</text>
      <text x="115" y="50" text-anchor="middle" fill="#a855f7" font-size="10">Compiles variables, modules</text>
      <text x="115" y="65" text-anchor="middle" fill="#94a3b8" font-size="9">Builds Resource Dependency Graph</text>
    </g>

    <!-- Plan Engine -->
    <g transform="translate(20, 165)">
      <rect width="230" height="85" rx="8" fill="#1e1b4b" stroke="#844feb" stroke-width="1.5" />
      <text x="115" y="30" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Execution Planner</text>
      <text x="115" y="50" text-anchor="middle" fill="#00f2fe" font-size="10">terraform plan</text>
      <text x="115" y="65" text-anchor="middle" fill="#94a3b8" font-size="9">Compares State vs Desired Configuration</text>
    </g>

    <!-- State Sync -->
    <g transform="translate(20, 270)">
      <rect width="230" height="85" rx="8" fill="#1e1b4b" stroke="#844feb" stroke-width="1.5" />
      <text x="115" y="30" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Applier / State Syncer</text>
      <text x="115" y="50" text-anchor="middle" fill="#10b981" font-size="10">terraform apply</text>
      <text x="115" y="65" text-anchor="middle" fill="#94a3b8" font-size="9">Provisions resources &amp; locks state</text>
    </g>
  </g>

  <!-- ================= RIGHT: PROVIDERS LAYER ================= -->
  <g transform="translate(670, 100)">
    <rect width="240" height="380" rx="10" fill="#111827" fill-opacity="0.5" stroke="#374151" stroke-width="1.5" />
    <text x="120" y="25" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="0.5">2. PLUGGABLE PROVIDERS</text>

    <!-- GCP Provider -->
    <g transform="translate(20, 50)">
      <rect width="200" height="85" rx="8" fill="url(#compGrad)" stroke="#3b82f6" stroke-width="1.5" />
      <text x="100" y="35" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">GCP Provider</text>
      <text x="100" y="55" text-anchor="middle" fill="#94a3b8" font-size="10">google / google-beta</text>
      <text x="100" y="68" text-anchor="middle" fill="#3b82f6" font-size="9">GCP API Translation</text>
    </g>

    <!-- AWS Provider -->
    <g transform="translate(20, 155)">
      <rect width="200" height="85" rx="8" fill="url(#compGrad)" stroke="#ea580c" stroke-width="1.5" />
      <text x="100" y="35" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">AWS Provider</text>
      <text x="100" y="55" text-anchor="middle" fill="#94a3b8" font-size="10">hashicorp/aws</text>
      <text x="100" y="68" text-anchor="middle" fill="#ea580c" font-size="9">AWS SDK Go Translation</text>
    </g>

    <!-- Azure Provider -->
    <g transform="translate(20, 260)">
      <rect width="200" height="85" rx="8" fill="url(#compGrad)" stroke="#10b981" stroke-width="1.5" />
      <text x="100" y="35" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">AzureRM Provider</text>
      <text x="100" y="55" text-anchor="middle" fill="#94a3b8" font-size="10">hashicorp/azurerm</text>
      <text x="100" y="68" text-anchor="middle" fill="#10b981" font-size="9">Azure ARM Translation</text>
    </g>
  </g>

  <!-- Connective Arrows (Input to Core, Core to Providers) -->
  <path d="M 280 290 L 340 290" stroke="#a855f7" stroke-width="3" fill="none" />
  <polygon points="340,290 330,285 330,295" fill="#a855f7" />
  
  <path d="M 610 290 L 670 290" stroke="#a855f7" stroke-width="3" fill="none" />
  <polygon points="670,290 660,285 660,295" fill="#a855f7" />

  <!-- ================= BOTTOM: PROVISIONED INFRASTRUCTURE ================= -->
  <!-- GCP Cloud Box -->
  <g transform="translate(40, 520)">
    <rect width="260" height="150" rx="10" fill="url(#cloudGcpGrad)" stroke="url(#gcpBorder)" stroke-width="2" />
    <text x="130" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">Google Cloud Platform (GCP)</text>
    <!-- GKE Node -->
    <rect x="25" y="45" width="210" height="35" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="35" y="67" fill="#e2e8f0" font-size="11">Google Kubernetes Engine (GKE)</text>
    <!-- GCS Node -->
    <rect x="25" y="90" width="210" height="35" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="35" y="112" fill="#e2e8f0" font-size="11">VPC / Compute / Cloud SQL</text>
  </g>

  <!-- AWS Cloud Box -->
  <g transform="translate(345, 520)">
    <rect width="260" height="150" rx="10" fill="url(#cloudAwsGrad)" stroke="url(#awsBorder)" stroke-width="2" />
    <text x="130" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">Amazon Web Services (AWS)</text>
    <!-- EKS Node -->
    <rect x="25" y="45" width="210" height="35" rx="4" fill="#0f172a" stroke="#ea580c" stroke-width="1" />
    <text x="35" y="67" fill="#e2e8f0" font-size="11">Elastic Kubernetes (EKS)</text>
    <!-- RDS Node -->
    <rect x="25" y="90" width="210" height="35" rx="4" fill="#0f172a" stroke="#ea580c" stroke-width="1" />
    <text x="35" y="112" fill="#e2e8f0" font-size="11">VPC / EC2 / RDS Databases</text>
  </g>

  <!-- Azure Cloud Box -->
  <g transform="translate(650, 520)">
    <rect width="260" height="150" rx="10" fill="url(#cloudAzureGrad)" stroke="url(#azureBorder)" stroke-width="2" />
    <text x="130" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">Microsoft Azure Cloud</text>
    <!-- AKS Node -->
    <rect x="25" y="45" width="210" height="35" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="35" y="67" fill="#e2e8f0" font-size="11">Azure Kubernetes Service (AKS)</text>
    <!-- Database Node -->
    <rect x="25" y="90" width="210" height="35" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="35" y="112" fill="#e2e8f0" font-size="11">VNet / VMs / Azure SQL DB</text>
  </g>

  <!-- Arrows from Providers to Target Clouds -->
  <!-- GCP Arrow -->
  <path d="M 720 480 L 720 500 L 170 500 L 170 520" stroke="#3b82f6" stroke-width="2.5" fill="none" />
  <polygon points="170,520 165,510 175,510" fill="#3b82f6" />

  <!-- AWS Arrow -->
  <path d="M 770 480 L 770 495 L 475 495 L 475 520" stroke="#ea580c" stroke-width="2.5" fill="none" />
  <polygon points="475,520 470,510 480,510" fill="#ea580c" />

  <!-- Azure Arrow -->
  <path d="M 820 480 L 820 520" stroke="#10b981" stroke-width="2.5" fill="none" />
  <polygon points="820,520 815,510 825,510" fill="#10b981" />
</svg>
