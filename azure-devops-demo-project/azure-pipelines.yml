trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  # Reference Azure Service Connection Name and Resource Group
  azureServiceConnection: 'MyAzureServiceConnection'
  resourceGroupName: 'my-devops-rg'
  webAppName: 'my-devops-demo-app'
  location: 'eastus'

stages:
  - stage: BuildStage
    displayName: 'Build & Test Application'
    jobs:
      - job: BuildAndTestJob
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js'

          - script: |
              cd azure-devops-demo-project
              npm ci
            displayName: 'Install dependencies'

          - script: |
              cd azure-devops-demo-project
              npm test
            displayName: 'Run unit tests'

          - script: |
              cd azure-devops-demo-project
              npm prune --production
            displayName: 'Prune devDependencies'

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/azure-devops-demo-project'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/deploy.zip'
              replaceExistingArchive: true
            displayName: 'Archive App Files'

          # Publish the built code zip and infra folder as pipeline artifacts
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/deploy.zip'
              artifact: 'drop'
            displayName: 'Publish Build Artifact'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/azure-devops-demo-project/infra'
              artifact: 'infra'
            displayName: 'Publish IaC Templates'

  - stage: DeployStage
    displayName: 'Deploy Infrastructure and App'
    dependsOn: BuildStage
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop
                - download: current
                  artifact: infra

                # 1. Deploy Resource Group and Resources via Bicep
                - task: AzureResourceManagerTemplateDeployment@3
                  inputs:
                    deploymentScope: 'Resource Group'
                    azureResourceIdOption: 'Arbitrary'
                    connectedServiceName: '$(azureServiceConnection)'
                    action: 'Create Or Update Resource Group'
                    resourceGroupName: '$(resourceGroupName)'
                    location: '$(location)'
                    templateLocation: 'Linked artifact'
                    csmFile: '$(Pipeline.Workspace)/infra/main.bicep'
                    overrideParameters: '-webAppName $(webAppName) -customWelcomeMessage "Deployed via Azure DevOps Pipelines!"'
                    deploymentMode: 'Incremental'
                  displayName: 'Deploy Infrastructure (Bicep)'

                # 2. Deploy the Node.js application to App Service
                - task: AzureRmWebAppDeployment@4
                  inputs:
                    FileType: 'Zip'
                    Package: '$(Pipeline.Workspace)/drop/deploy.zip'
                    azureSubscription: '$(azureServiceConnection)'
                    WebAppName: '$(webAppName)'
                    enableCustomDeployment: true
                    DeploymentType: 'webDeploy'
                  displayName: 'Deploy App Code to App Service'
