name: Build and Deploy to Azure Web App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    name: Build & Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'azure-devops-demo-project/package.json'

      - name: Install Dependencies
        run: |
          cd azure-devops-demo-project
          npm ci

      - name: Run Unit Tests
        run: |
          cd azure-devops-demo-project
          npm test

  deploy-to-azure:
    name: Deploy to Azure (Bicep + Code)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Azure Resources (IaC Bicep)
        id: deploy-resources
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: ./azure-devops-demo-project/infra/main.bicep
          parameters: webAppName=${{ secrets.AZURE_WEBAPP_NAME }} customWelcomeMessage="Deployed via GitHub Actions CI/CD!"
          failOnStdErr: false

      - name: Set up Node.js for Packaging
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package Web Application
        run: |
          cd azure-devops-demo-project
          npm install --production
          zip -r ../deploy.zip ./*

      - name: Deploy App Code to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: ./deploy.zip
