<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%" style="background-color: #0c1017; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="sqlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="nosqlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    
    <!-- Neon Border Gradients -->
    <linearGradient id="sqlBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="nosqlBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Shadows & Glows -->
    <filter id="glowSql" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="500" y="45" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="1">SQL VS. NOSQL DATABASE ARCHITECTURES</text>
  <text x="500" y="70" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="400">Comparing Relational ACID Engines with Distributed Horizontal BASE Environments</text>

  <!-- ================= LEFT: SQL RELATIONAL ARCHITECTURE ================= -->
  <g transform="translate(40, 110)">
    <rect width="430" height="580" rx="12" fill="url(#sqlBg)" stroke="url(#sqlBorder)" stroke-width="2" filter="url(#glowSql)" />
    <text x="215" y="35" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="800" letter-spacing="0.5">RELATIONAL DATABASE (SQL)</text>
    <text x="215" y="55" text-anchor="middle" fill="#8b949e" font-size="10">ACID Transactions &amp; Normalization</text>

    <!-- Structured Schemas / Relations -->
    <g transform="translate(25, 80)">
      <rect width="380" height="130" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="190" y="25" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Structured Schema (Tables)</text>
      
      <!-- Visual Relational Tables -->
      <g transform="translate(20, 45)">
        <rect width="150" height="70" rx="4" fill="#0d1117" stroke="#38bdf8" stroke-width="1" />
        <text x="75" y="20" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="700">users (PK: id)</text>
        <line x1="10" y1="30" x2="140" y2="30" stroke="#30363d" stroke-width="1" />
        <text x="15" y="45" fill="#8b949e" font-size="8">id | name | email</text>
      </g>
      
      <g transform="translate(210, 45)">
        <rect width="150" height="70" rx="4" fill="#0d1117" stroke="#38bdf8" stroke-width="1" />
        <text x="75" y="20" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="700">orders (FK: user_id)</text>
        <line x1="10" y1="30" x2="140" y2="30" stroke="#30363d" stroke-width="1" />
        <text x="15" y="45" fill="#8b949e" font-size="8">id | amount | user_id</text>
      </g>
      
      <!-- Relationship line -->
      <path d="M 170 80 L 210 80" stroke="#ff7a59" stroke-width="1.5" stroke-dasharray="3,3" fill="none" />
    </g>

    <!-- Query Processor & Planner -->
    <g transform="translate(25, 230)">
      <rect width="380" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="190" y="25" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Query Planner &amp; Optimizer</text>
      
      <!-- Flow steps -->
      <g transform="translate(15, 45)">
        <rect width="100" height="85" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="50" y="30" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">SQL Parser</text>
        <text x="50" y="45" text-anchor="middle" fill="#8b949e" font-size="8">Checks syntax</text>
      </g>
      
      <g transform="translate(135, 45)">
        <rect width="110" height="85" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="55" y="30" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">Query Planner</text>
        <text x="55" y="45" text-anchor="middle" fill="#8b949e" font-size="8">Generates AST &amp;</text>
        <text x="55" y="58" text-anchor="middle" fill="#8b949e" font-size="8">execution plans</text>
      </g>

      <g transform="translate(265, 45)">
        <rect width="100" height="85" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="50" y="30" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">Execution Plan</text>
        <text x="50" y="45" text-anchor="middle" fill="#8b949e" font-size="8">Table index scans</text>
      </g>

      <!-- Connectors -->
      <path d="M 115 85 L 135 85" stroke="#38bdf8" stroke-width="2" fill="none" />
      <path d="M 245 85 L 265 85" stroke="#38bdf8" stroke-width="2" fill="none" />
    </g>

    <!-- Storage Engine / WAL -->
    <g transform="translate(25, 400)">
      <rect width="380" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="190" y="25" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Storage &amp; Transaction Manager</text>
      
      <g transform="translate(20, 50)">
        <rect width="160" height="80" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1" />
        <text x="80" y="30" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">B-Tree Indexes</text>
        <text x="80" y="50" text-anchor="middle" fill="#8b949e" font-size="8">Logarithmic searches</text>
      </g>
      
      <g transform="translate(200, 50)">
        <rect width="160" height="80" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1" />
        <text x="80" y="30" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">WAL / Logs</text>
        <text x="80" y="50" text-anchor="middle" fill="#8b949e" font-size="8">Ensures Durability</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT: NOSQL DISTRIBUTED ARCHITECTURE ================= -->
  <g transform="translate(530, 110)">
    <rect width="430" height="580" rx="12" fill="url(#nosqlBg)" stroke="url(#nosqlBorder)" stroke-width="2" />
    <text x="215" y="35" text-anchor="middle" fill="#34d399" font-size="16" font-weight="800" letter-spacing="0.5">NON-RELATIONAL DATABASE (NOSQL)</text>
    <text x="215" y="55" text-anchor="middle" fill="#8b949e" font-size="10">BASE Properties &amp; Eventual Consistency</text>

    <!-- Dynamic Schemas / Document Structures -->
    <g transform="translate(25, 80)">
      <rect width="380" height="130" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="190" y="25" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Dynamic Schemas (JSON Documents)</text>
      
      <!-- Visual JSON Documents -->
      <g transform="translate(20, 45)">
        <rect width="340" height="70" rx="4" fill="#0d1117" stroke="#34d399" stroke-width="1" />
        <text x="20" y="20" fill="#34d399" font-size="9" font-weight="700">{</text>
        <text x="40" y="35" fill="#8b949e" font-size="9">"_id": "usr_101", "name": "Alice",</text>
        <text x="40" y="50" fill="#8b949e" font-size="9">"skills": ["Python", "Docker"], "active": true</text>
        <text x="20" y="65" fill="#34d399" font-size="9">}</text>
      </g>
    </g>

    <!-- Distributed Router & Sharding proxy -->
    <g transform="translate(25, 230)">
      <rect width="380" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="190" y="25" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Routing &amp; Partitioning (Sharding)</text>
      
      <!-- Router Nodes -->
      <g transform="translate(20, 50)">
        <rect width="100" height="80" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="50" y="35" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">Query Router</text>
        <text x="50" y="50" text-anchor="middle" fill="#8b949e" font-size="8">Directs traffic</text>
      </g>

      <g transform="translate(135, 50)">
        <circle cx="110" cy="40" r="30" fill="none" stroke="#34d399" stroke-width="2" />
        <text x="110" y="44" text-anchor="middle" fill="#34d399" font-size="8" font-weight="700">Hash Ring</text>
        <circle cx="90" cy="20" r="4" fill="#ff7a59" />
        <circle cx="130" cy="60" r="4" fill="#2088ff" />
        <text x="110" y="85" text-anchor="middle" fill="#8b949e" font-size="8">Consistent Hashing</text>
      </g>

      <g transform="translate(260, 50)">
        <rect width="100" height="80" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
        <text x="50" y="35" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">Partitions</text>
        <text x="50" y="50" text-anchor="middle" fill="#8b949e" font-size="8">Distributes keys</text>
      </g>
    </g>

    <!-- Master-Slave Eventual Replication -->
    <g transform="translate(25, 400)">
      <rect width="380" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="190" y="25" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Eventual Consistency Replication</text>
      
      <!-- Master Node -->
      <g transform="translate(30, 50)">
        <rect width="90" height="70" rx="6" fill="#0d1117" stroke="#ff7a59" stroke-width="1.5" />
        <text x="45" y="35" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="700">Primary</text>
        <text x="45" y="50" text-anchor="middle" fill="#ff7a59" font-size="8">(Master)</text>
      </g>
      
      <!-- Replicas -->
      <g transform="translate(150, 50)">
        <rect width="90" height="70" rx="6" fill="#0d1117" stroke="#34d399" stroke-width="1" />
        <text x="45" y="35" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">Secondary</text>
        <text x="45" y="50" text-anchor="middle" fill="#8b949e" font-size="8">(Replica 1)</text>
      </g>

      <g transform="translate(260, 50)">
        <rect width="90" height="70" rx="6" fill="#0d1117" stroke="#34d399" stroke-width="1" />
        <text x="45" y="35" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">Secondary</text>
        <text x="45" y="50" text-anchor="middle" fill="#8b949e" font-size="8">(Replica 2)</text>
      </g>

      <!-- Replication sync arrows -->
      <path d="M 120 75 Q 135 60 150 75" fill="none" stroke="#8b949e" stroke-width="1.5" />
      <path d="M 120 100 Q 190 120 260 100" fill="none" stroke="#8b949e" stroke-width="1.5" />
    </g>
  </g>
</svg>
