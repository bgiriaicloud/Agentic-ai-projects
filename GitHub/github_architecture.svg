<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%" style="background-color: #0d1117; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f05032" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f05032" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="githubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24292f" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="actionsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2088ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2088ff" stop-opacity="0.05" />
    </linearGradient>
    
    <!-- Neon Border Gradients -->
    <linearGradient id="gitBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f05032" />
      <stop offset="100%" stop-color="#ff7a59" />
    </linearGradient>
    <linearGradient id="githubBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b949e" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="actionsBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2088ff" />
      <stop offset="100%" stop-color="#40a6ff" />
    </linearGradient>

    <!-- Shadows & Glows -->
    <filter id="glowGit" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="500" y="45" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="1">GIT, GITHUB &amp; GITHUB ACTIONS ARCHITECTURE</text>
  <text x="500" y="70" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="400">Development Lifecycle from Local Workspaces to Continuous Deployment (CI/CD)</text>

  <!-- ================= LEFT: LOCAL DEVELOPMENT (GIT) ================= -->
  <g transform="translate(40, 110)">
    <rect width="260" height="580" rx="12" fill="url(#gitGrad)" stroke="url(#gitBorder)" stroke-width="2" filter="url(#glowGit)" />
    <text x="130" y="35" text-anchor="middle" fill="#f05032" font-size="16" font-weight="800" letter-spacing="0.5">LOCAL ENVIRONMENT (GIT)</text>
    <text x="130" y="55" text-anchor="middle" fill="#8b949e" font-size="10">Distributed Version Control System</text>

    <!-- Working Directory Card -->
    <g transform="translate(20, 80)">
      <rect width="220" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="110" y="30" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Working Directory</text>
      <text x="110" y="55" text-anchor="middle" fill="#8b949e" font-size="10">Local filesystem edits</text>
      <rect x="25" y="75" width="170" height="30" rx="4" fill="#21262d" stroke="#f05032" stroke-width="1" />
      <text x="110" y="94" text-anchor="middle" fill="#f05032" font-size="11" font-weight="700">Untracked / Modified</text>
    </g>

    <!-- Staging Area Card -->
    <g transform="translate(20, 240)">
      <rect width="220" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="110" y="30" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Staging Area (Index)</text>
      <text x="110" y="55" text-anchor="middle" fill="#8b949e" font-size="10">Buffers changes for commit</text>
      <rect x="25" y="75" width="170" height="30" rx="4" fill="#21262d" stroke="#ff7a59" stroke-width="1" />
      <text x="110" y="94" text-anchor="middle" fill="#ff7a59" font-size="11" font-weight="700">git add .</text>
    </g>

    <!-- Local Repository Card -->
    <g transform="translate(20, 400)">
      <rect width="220" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="110" y="30" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Local Repository (.git)</text>
      <text x="110" y="50" text-anchor="middle" fill="#8b949e" font-size="10">Commit database &amp; branches</text>
      
      <!-- Commit nodes -->
      <circle cx="60" cy="95" r="10" fill="#f05032" />
      <circle cx="110" cy="95" r="10" fill="#f05032" />
      <circle cx="160" cy="95" r="10" fill="#f05032" />
      <line x1="70" y1="95" x2="100" y2="95" stroke="#8b949e" stroke-width="2" />
      <line x1="120" y1="95" x2="150" y2="95" stroke="#8b949e" stroke-width="2" />
      <text x="110" y="130" text-anchor="middle" fill="#8b949e" font-size="9" font-weight="700">git commit -m "commit"</text>
    </g>
  </g>

  <!-- ================= MIDDLE: GITHUB COLLABORATION PLATFORM ================= -->
  <g transform="translate(360, 110)">
    <rect width="280" height="580" rx="12" fill="url(#githubGrad)" stroke="url(#githubBorder)" stroke-width="2.5" />
    <text x="140" y="35" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800" letter-spacing="0.5">GITHUB REMOTE REPOSITORY</text>
    <text x="140" y="55" text-anchor="middle" fill="#8b949e" font-size="10">Cloud Collaboration &amp; Repository Hosting</text>

    <!-- Branching Node Area -->
    <g transform="translate(20, 80)">
      <rect width="240" height="150" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
      <text x="120" y="25" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Branching &amp; Releases</text>
      <text x="120" y="45" text-anchor="middle" fill="#8b949e" font-size="9">main / feature branch splits</text>
      
      <!-- Visual Branch Graph -->
      <line x1="40" y1="90" x2="200" y2="90" stroke="#30363d" stroke-width="3" />
      <path d="M 80 90 Q 110 120 140 120 L 200 120" fill="none" stroke="#2088ff" stroke-width="3" />
      <circle cx="80" cy="90" r="5" fill="#f05032" />
      <circle cx="140" cy="120" r="5" fill="#2088ff" />
      <text x="120" y="75" text-anchor="middle" fill="#8b949e" font-size="9">pull requests / tags</text>
    </g>

    <!-- Pull Request & Code Review -->
    <g transform="translate(20, 250)">
      <rect width="240" height="140" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
      <text x="120" y="30" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Pull Request Gates</text>
      <text x="120" y="50" text-anchor="middle" fill="#8b949e" font-size="10">Code Reviews &amp; Merging</text>
      <rect x="30" y="75" width="180" height="45" rx="4" fill="#161b22" stroke="#56d364" stroke-width="1.5" />
      <text x="120" y="93" text-anchor="middle" fill="#56d364" font-size="11" font-weight="700">PR Approved &amp; Merged</text>
      <text x="120" y="108" text-anchor="middle" fill="#8b949e" font-size="9">Trigger actions on merge</text>
    </g>

    <!-- Secrets & Variables -->
    <g transform="translate(20, 410)">
      <rect width="240" height="140" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
      <text x="120" y="30" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Secrets &amp; Configuration</text>
      <text x="120" y="50" text-anchor="middle" fill="#8b949e" font-size="10">Encrypted Environment Variables</text>
      <rect x="30" y="80" width="180" height="40" rx="4" fill="#161b22" stroke="#db6d28" stroke-width="1" />
      <text x="120" y="104" text-anchor="middle" fill="#db6d28" font-size="11" font-weight="700">${{ secrets.API_KEY }}</text>
    </g>
  </g>

  <!-- ================= RIGHT: GITHUB ACTIONS (CI/CD) ================= -->
  <g transform="translate(690, 110)">
    <rect width="270" height="580" rx="12" fill="url(#actionsGrad)" stroke="url(#actionsBorder)" stroke-width="2" />
    <text x="135" y="35" text-anchor="middle" fill="#2088ff" font-size="16" font-weight="800" letter-spacing="0.5">GITHUB ACTIONS (CI/CD)</text>
    <text x="135" y="55" text-anchor="middle" fill="#8b949e" font-size="10">Automated Pipeline Orchestrator</text>

    <!-- Workflow Trigger Card -->
    <g transform="translate(20, 80)">
      <rect width="230" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="115" y="30" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Workflows (.github/)</text>
      <text x="115" y="50" text-anchor="middle" fill="#2088ff" font-size="10">on: [push, pull_request]</text>
      <text x="115" y="70" text-anchor="middle" fill="#8b949e" font-size="9">Triggers event loop execution</text>
    </g>

    <!-- Jobs Runner Card -->
    <g transform="translate(20, 210)">
      <rect width="230" height="170" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="115" y="30" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Jobs &amp; Runner VM</text>
      <text x="115" y="50" text-anchor="middle" fill="#8b949e" font-size="10">runs-on: ubuntu-latest</text>
      
      <!-- Inside VM steps -->
      <rect x="20" y="75" width="190" height="75" rx="6" fill="#0d1117" stroke="#2088ff" stroke-width="1" />
      <text x="35" y="95" fill="#f8fafc" font-size="10">Step 1: actions/checkout</text>
      <text x="35" y="115" fill="#f8fafc" font-size="10">Step 2: setup-python</text>
      <text x="35" y="135" fill="#f8fafc" font-size="10">Step 3: pytest (run tests)</text>
    </g>

    <!-- Build Artifacts & Deploy -->
    <g transform="translate(20, 400)">
      <rect width="230" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="115" y="30" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Artifacts &amp; Deploy</text>
      <text x="115" y="50" text-anchor="middle" fill="#8b949e" font-size="10">upload-artifact / release</text>
      <rect x="20" y="80" width="190" height="50" rx="4" fill="#0d1117" stroke="#2088ff" stroke-width="1" />
      <text x="115" y="100" text-anchor="middle" fill="#2088ff" font-size="11" font-weight="700">Target Cloud Deploy</text>
      <text x="115" y="115" text-anchor="middle" fill="#8b949e" font-size="9">GCP, AWS, Azure, GHCR</text>
    </g>
  </g>

  <!-- Connective Sync Arrows -->
  
  <!-- Git Push Local -> Remote -->
  <path d="M 300 365 L 360 365" stroke="#f05032" stroke-width="3" stroke-dasharray="5,5" fill="none" />
  <polygon points="360,365 350,360 350,370" fill="#f05032" />
  <text x="330" y="350" text-anchor="middle" fill="#f05032" font-size="10" font-weight="700">git push</text>

  <!-- PR Merge -> Actions Trigger -->
  <path d="M 640 365 L 690 365" stroke="#2088ff" stroke-width="3" fill="none" />
  <polygon points="690,365 680,360 680,370" fill="#2088ff" />
  <text x="665" y="350" text-anchor="middle" fill="#2088ff" font-size="10" font-weight="700">Trigger</text>
</svg>
