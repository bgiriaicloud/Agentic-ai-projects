steps:
  # 1. Install Node.js dependencies and execute the test suite
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd gcp-devops-demo-project
        npm ci
        npm test
    id: 'Test-App'

  # 2. Run Terraform to deploy infrastructure
  - name: 'hashicorp/terraform:1.6.0'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd gcp-devops-demo-project/infra
        terraform init
        terraform apply -auto-approve \
          -var="project_id=$PROJECT_ID" \
          -var="region=$_REGION"
    id: 'Deploy-Infrastructure'

  # 3. Build container image using Docker daemon
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/gcp-devops-demo-repo/web-dashboard:$COMMIT_SHA'
      - './gcp-devops-demo-project'
    id: 'Build-Image'
    waitFor: ['Test-App']

  # 4. Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/gcp-devops-demo-repo/web-dashboard:$COMMIT_SHA'
    id: 'Push-Image'
    waitFor: ['Build-Image', 'Deploy-Infrastructure']

  # 5. Deploy the image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'gcp-devops-demo-app'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/gcp-devops-demo-repo/web-dashboard:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
    id: 'Deploy-to-CloudRun'
    waitFor: ['Push-Image']

substitutions:
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
