<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 720" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="pyCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#306998" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffe873" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pvmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>
    
    <!-- Neon Border Gradients -->
    <linearGradient id="pythonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#306998" />
      <stop offset="100%" stop-color="#ffe873" />
    </linearGradient>
    <linearGradient id="blueBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#306998" />
      <stop offset="100%" stop-color="#4b8bbe" />
    </linearGradient>
    <linearGradient id="yellowBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe873" />
      <stop offset="100%" stop-color="#ffd43b" />
    </linearGradient>
    
    <!-- Shadows & Glows -->
    <filter id="glowPython" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="475" y="40" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="1">PYTHON COMPILATION &amp; RUNTIME ARCHITECTURE</text>
  <text x="475" y="60" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="400">Bytecode Compilation Flow and Python Virtual Machine (PVM) Execution Engine</text>

  <!-- ================= LEFT: PYTHON SOURCE CODE ================= -->
  <g transform="translate(40, 100)">
    <rect width="220" height="380" rx="10" fill="#111827" fill-opacity="0.5" stroke="#374151" stroke-width="1.5" />
    <text x="110" y="25" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="0.5">1. SOURCE STAGE</text>
    
    <!-- Python Script Card -->
    <g transform="translate(15, 50)">
      <rect width="190" height="110" rx="8" fill="url(#compGrad)" stroke="url(#blueBorder)" stroke-width="1.5" />
      <text x="20" y="30" fill="#f8fafc" font-size="13" font-weight="700">Source Code (.py)</text>
      <text x="20" y="55" fill="#64748b" font-size="10">def hello():</text>
      <text x="20" y="70" fill="#64748b" font-size="10">    print("Hello World")</text>
      <text x="20" y="90" fill="#306998" font-size="10" font-weight="600">Human-Readable Code</text>
    </g>

    <!-- AST Card -->
    <g transform="translate(15, 210)">
      <rect width="190" height="110" rx="8" fill="url(#compGrad)" stroke="url(#blueBorder)" stroke-width="1.5" />
      <text x="20" y="30" fill="#f8fafc" font-size="13" font-weight="700">Abstract Syntax Tree</text>
      <text x="20" y="55" fill="#64748b" font-size="10">tokens parsed into</text>
      <text x="20" y="70" fill="#64748b" font-size="10">AST Node structures</text>
      <text x="20" y="90" fill="#306998" font-size="10" font-weight="600">ast.Module Node Graph</text>
    </g>
  </g>

  <!-- ================= MIDDLE: PYTHON COMPILER ================= -->
  <g transform="translate(320, 100)">
    <rect width="280" height="380" rx="12" fill="url(#compGrad)" stroke="url(#pythonBorder)" stroke-width="2" filter="url(#glowPython)" />
    <text x="140" y="30" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800" letter-spacing="1">PYTHON INTERPRETER CORE</text>
    
    <!-- Parser / Tokenizer -->
    <g transform="translate(25, 60)">
      <rect width="230" height="85" rx="8" fill="#1e1b4b" stroke="#306998" stroke-width="1.5" />
      <text x="115" y="30" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Lexer &amp; Parser</text>
      <text x="115" y="50" text-anchor="middle" fill="#4b8bbe" font-size="10">Tokenizes script characters</text>
      <text x="115" y="65" text-anchor="middle" fill="#94a3b8" font-size="9">Generates tokens stream</text>
    </g>

    <!-- Bytecode Compiler -->
    <g transform="translate(25, 165)">
      <rect width="230" height="85" rx="8" fill="#1e1b4b" stroke="#306998" stroke-width="1.5" />
      <text x="115" y="30" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Bytecode Compiler</text>
      <text x="115" y="50" text-anchor="middle" fill="#ffe873" font-size="10">Translates AST to Bytecode</text>
      <text x="115" y="65" text-anchor="middle" fill="#94a3b8" font-size="9">Writes intermediate files</text>
    </g>

    <!-- Bytecode Card -->
    <g transform="translate(25, 270)">
      <rect width="230" height="85" rx="8" fill="url(#pvmGrad)" stroke="url(#yellowBorder)" stroke-width="1.5" />
      <text x="115" y="30" text-anchor="middle" fill="#ffe873" font-size="12" font-weight="700">Bytecode (.pyc)</text>
      <text x="115" y="50" text-anchor="middle" fill="#ffffff" font-size="10">__pycache__/ (CPython)</text>
      <text x="115" y="65" text-anchor="middle" fill="#94a3b8" font-size="9">Platform-Independent Instructions</text>
    </g>
  </g>

  <!-- ================= RIGHT: PYTHON VIRTUAL MACHINE (PVM) ================= -->
  <g transform="translate(660, 100)">
    <rect width="250" height="380" rx="10" fill="#111827" fill-opacity="0.5" stroke="#374151" stroke-width="1.5" />
    <text x="125" y="25" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="0.5">2. RUNTIME (PVM)</text>

    <!-- Execution Engine -->
    <g transform="translate(20, 50)">
      <rect width="210" height="85" rx="8" fill="url(#compGrad)" stroke="url(#yellowBorder)" stroke-width="1.5" />
      <text x="105" y="35" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Execution Engine</text>
      <text x="105" y="55" text-anchor="middle" fill="#ffe873" font-size="10">Bytecode Interpreter Loop</text>
      <text x="105" y="68" text-anchor="middle" fill="#94a3b8" font-size="9">Executes instructions sequentially</text>
    </g>

    <!-- Garbage Collector -->
    <g transform="translate(20, 155)">
      <rect width="210" height="85" rx="8" fill="url(#compGrad)" stroke="url(#yellowBorder)" stroke-width="1.5" />
      <text x="105" y="35" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Garbage Collector</text>
      <text x="105" y="55" text-anchor="middle" fill="#64748b" font-size="10">Reference Counting</text>
      <text x="105" y="68" text-anchor="middle" fill="#94a3b8" font-size="9">Generational Cyclic Collector</text>
    </g>

    <!-- Standard Library -->
    <g transform="translate(20, 260)">
      <rect width="210" height="85" rx="8" fill="url(#compGrad)" stroke="url(#yellowBorder)" stroke-width="1.5" />
      <text x="105" y="35" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Standard Library</text>
      <text x="105" y="55" text-anchor="middle" fill="#64748b" font-size="10">Built-in Modules</text>
      <text x="105" y="68" text-anchor="middle" fill="#306998" font-size="9">sys, os, math, collections</text>
    </g>
  </g>

  <!-- Connective Arrows -->
  <path d="M 260 290 L 320 290" stroke="#4b8bbe" stroke-width="3" fill="none" />
  <polygon points="320,290 310,285 310,295" fill="#4b8bbe" />
  
  <path d="M 600 290 L 660 290" stroke="#ffd43b" stroke-width="3" fill="none" />
  <polygon points="660,290 650,285 650,295" fill="#ffd43b" />

  <!-- ================= BOTTOM: OPERATING SYSTEM / HARDWARE ================= -->
  <g transform="translate(40, 520)">
    <rect width="870" height="150" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="435" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">TARGET ENVIRONMENT (OS / HARDWARE LAYER)</text>
    
    <!-- Linux Box -->
    <g transform="translate(30, 45)">
      <rect width="240" height="80" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="120" y="35" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">Linux Space</text>
      <text x="120" y="55" text-anchor="middle" fill="#64748b" font-size="10">Processes / Thread mapping</text>
    </g>

    <!-- Windows Box -->
    <g transform="translate(315, 45)">
      <rect width="240" height="80" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="120" y="35" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">Windows Space</text>
      <text x="120" y="55" text-anchor="middle" fill="#64748b" font-size="10">Win32 API bindings</text>
    </g>

    <!-- macOS Box -->
    <g transform="translate(600, 45)">
      <rect width="240" height="80" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="120" y="35" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">macOS Space</text>
      <text x="120" y="55" text-anchor="middle" fill="#64748b" font-size="10">Darwin / POSIX bindings</text>
    </g>
  </g>

  <!-- Flow Arrows to Target OS -->
  <path d="M 785 480 L 785 520" stroke="#ffd43b" stroke-width="2.5" fill="none" />
  <polygon points="785,520 780,510 790,510" fill="#ffd43b" />
</svg>
