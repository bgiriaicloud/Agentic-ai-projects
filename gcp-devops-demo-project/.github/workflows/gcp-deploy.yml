name: Build and Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test Node.js App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'gcp-devops-demo-project/package.json'

      - name: Install Dependencies
        run: |
          cd gcp-devops-demo-project
          npm ci

      - name: Run Unit Tests
        run: |
          cd gcp-devops-demo-project
          npm test

  deploy-to-gcp:
    name: Deploy to Google Cloud (Terraform + Cloud Run)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init & Apply
        run: |
          cd gcp-devops-demo-project/infra
          terraform init
          terraform apply -auto-approve \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ secrets.GCP_REGION }}"

      - name: Configure Docker Credentials
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          cd gcp-devops-demo-project
          IMAGE_PATH="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gcp-devops-demo-repo/web-dashboard:latest"
          docker build -t $IMAGE_PATH .
          docker push $IMAGE_PATH

      - name: Redeploy Cloud Run Service
        run: |
          gcloud run deploy gcp-devops-demo-app \
            --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gcp-devops-demo-repo/web-dashboard:latest \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed
