name: Build and Deploy to AWS App Runner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test Node.js App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'aws-devops-demo-project/package.json'

      - name: Install Dependencies
        run: |
          cd aws-devops-demo-project
          npm ci

      - name: Run Unit Tests
        run: |
          cd aws-devops-demo-project
          npm test

  deploy-to-aws:
    name: Deploy to AWS (Terraform + App Runner)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init & Apply
        run: |
          cd aws-devops-demo-project/infra
          terraform init
          terraform apply -auto-approve \
            -var="region=${{ secrets.AWS_REGION }}"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image to Amazon ECR
        run: |
          cd aws-devops-demo-project
          IMAGE_TAG="latest"
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_PATH="$ECR_REGISTRY/aws-devops-demo-repo:$IMAGE_TAG"
          docker build -t $IMAGE_PATH .
          docker push $IMAGE_PATH

      - name: Update AWS App Runner Service
        run: |
          aws apprunner start-deployment \
            --service-arn "arn:aws:apprunner:${{ secrets.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:service/aws-devops-demo-app/*"
