<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="userSpaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#243b55" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="kernelSpaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#203a43" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2c5364" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="hardwareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1c2c" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#928dab" stop-opacity="0.3" />
    </linearGradient>
    
    <!-- Neon Border Gradients -->
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="blueBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <linearGradient id="orangeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f857a6" />
      <stop offset="100%" stop-color="#ff5858" />
    </linearGradient>
    
    <!-- Component Gradients -->
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Shadows & Glows -->
    <filter id="glowCyan" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowBlue" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="450" y="45" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="1">LINUX OPERATING SYSTEM ARCHITECTURE</text>
  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="400">User Space &amp; Kernel Space Execution Isolation</text>

  <!-- ================= USER SPACE LAYER ================= -->
  <g transform="translate(40, 90)">
    <!-- Container Card -->
    <rect width="820" height="150" rx="12" fill="url(#userSpaceGrad)" stroke="url(#cyanBorder)" stroke-width="2" />
    <text x="20" y="28" fill="#00f2fe" font-size="14" font-weight="700" letter-spacing="0.5">USER SPACE (Restricted Mode - Ring 3)</text>
    
    <!-- User Applications Component -->
    <g transform="translate(30, 50)">
      <rect width="230" height="75" rx="8" fill="url(#compGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="115" y="35" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">User Applications</text>
      <text x="115" y="55" text-anchor="middle" fill="#64748b" font-size="11">Nginx, Python, MySQL, Redis</text>
    </g>

    <!-- System Utilities Component -->
    <g transform="translate(295, 50)">
      <rect width="230" height="75" rx="8" fill="url(#compGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="115" y="35" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">System Utilities</text>
      <text x="115" y="55" text-anchor="middle" fill="#64748b" font-size="11">bash, systemd, tar, grep, ip</text>
    </g>

    <!-- C Library Component -->
    <g transform="translate(560, 50)">
      <rect width="230" height="75" rx="8" fill="url(#compGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="115" y="35" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Standard C Library</text>
      <text x="115" y="55" text-anchor="middle" fill="#00f2fe" font-size="11">glibc, musl (API Translations)</text>
    </g>
  </g>

  <!-- ================= SYSTEM CALL INTERFACE BOUNDARY ================= -->
  <g transform="translate(40, 260)">
    <line x1="100" y1="20" x2="720" y2="20" stroke="#f857a6" stroke-width="3" stroke-dasharray="8 6" filter="url(#glowCyan)" />
    <polygon points="100,20 90,15 90,25" fill="#f857a6" />
    <polygon points="720,20 730,15 730,25" fill="#f857a6" />
    
    <rect x="290" y="5" width="320" height="30" rx="15" fill="#1e1b4b" stroke="#f857a6" stroke-width="1.5" />
    <text x="450" y="24" text-anchor="middle" fill="#f857a6" font-size="11" font-weight="800" letter-spacing="1">SYSTEM CALL INTERFACE (SCI) BOUNDARY</text>
  </g>

  <!-- Flow Arrows between User and Kernel Space -->
  <path d="M 300 240 L 300 300" stroke="#00f2fe" stroke-width="2.5" fill="none" marker-end="url(#arrowCyan)" />
  <path d="M 600 300 L 600 240" stroke="#ff5858" stroke-width="2.5" fill="none" marker-end="url(#arrowRed)" />
  <text x="210" y="280" fill="#64748b" font-size="11" font-weight="500">Syscall (open, read, write)</text>
  
  <!-- ================= KERNEL SPACE LAYER ================= -->
  <g transform="translate(40, 320)">
    <!-- Container Card -->
    <rect width="820" height="240" rx="12" fill="url(#kernelSpaceGrad)" stroke="url(#blueBorder)" stroke-width="2" />
    <text x="20" y="28" fill="#00c6ff" font-size="14" font-weight="700" letter-spacing="0.5">KERNEL SPACE (Supervisor Mode - Ring 0)</text>

    <!-- Subsystems Grid -->
    <!-- 1. Process Management -->
    <g transform="translate(30, 50)">
      <rect width="175" height="75" rx="8" fill="url(#compGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="87.5" y="30" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Process Management</text>
      <text x="87.5" y="48" text-anchor="middle" fill="#00c6ff" font-size="10">CFS Scheduler</text>
      <text x="87.5" y="62" text-anchor="middle" fill="#64748b" font-size="9">fork, execve, signals</text>
    </g>

    <!-- 2. Memory Management -->
    <g transform="translate(225, 50)">
      <rect width="175" height="75" rx="8" fill="url(#compGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="87.5" y="30" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Memory Management</text>
      <text x="87.5" y="48" text-anchor="middle" fill="#00c6ff" font-size="10">Virtual Memory / MMU</text>
      <text x="87.5" y="62" text-anchor="middle" fill="#64748b" font-size="9">paging, swap, allocation</text>
    </g>

    <!-- 3. Virtual File System -->
    <g transform="translate(420, 50)">
      <rect width="175" height="75" rx="8" fill="url(#compGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="87.5" y="30" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Virtual File System</text>
      <text x="87.5" y="48" text-anchor="middle" fill="#00c6ff" font-size="10">VFS Abstraction</text>
      <text x="87.5" y="62" text-anchor="middle" fill="#64748b" font-size="9">ext4, xfs, nfs, btrfs</text>
    </g>

    <!-- 4. Network Stack -->
    <g transform="translate(615, 50)">
      <rect width="175" height="75" rx="8" fill="url(#compGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="87.5" y="30" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Network Stack</text>
      <text x="87.5" y="48" text-anchor="middle" fill="#00c6ff" font-size="10">TCP/IP &amp; Sockets</text>
      <text x="87.5" y="62" text-anchor="middle" fill="#64748b" font-size="9">routing, netfilter, protocols</text>
    </g>

    <!-- Device Drivers Layer -->
    <g transform="translate(30, 145)">
      <rect width="760" height="70" rx="8" fill="url(#compGrad)" stroke="#1e293b" stroke-width="1.5" />
      <text x="380" y="30" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">Device Drivers Layer</text>
      <text x="380" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">SATA Disk Drivers, USB Controllers, Ethernet NIC Drivers, GPU Controllers</text>
    </g>
  </g>

  <!-- ================= HARDWARE SPACE LAYER ================= -->
  <g transform="translate(40, 580)">
    <!-- Container Card -->
    <rect width="820" height="90" rx="12" fill="url(#hardwareGrad)" stroke="url(#orangeBorder)" stroke-width="2" />
    <text x="20" y="25" fill="#f857a6" font-size="13" font-weight="700" letter-spacing="0.5">PHYSICAL HARDWARE LAYER</text>

    <!-- CPU Component -->
    <g transform="translate(30, 38)">
      <rect width="230" height="40" rx="6" fill="#1e1b4b" stroke="#312e81" stroke-width="1.5" />
      <text x="115" y="24" text-anchor="middle" fill="#f857a6" font-size="11" font-weight="700">CPU (Processors / Registers)</text>
    </g>

    <!-- RAM Component -->
    <g transform="translate(295, 38)">
      <rect width="230" height="40" rx="6" fill="#1e1b4b" stroke="#312e81" stroke-width="1.5" />
      <text x="115" y="24" text-anchor="middle" fill="#f857a6" font-size="11" font-weight="700">Memory (Physical RAM)</text>
    </g>

    <!-- Storage / NIC Component -->
    <g transform="translate(560, 38)">
      <rect width="230" height="40" rx="6" fill="#1e1b4b" stroke="#312e81" stroke-width="1.5" />
      <text x="115" y="24" text-anchor="middle" fill="#f857a6" font-size="11" font-weight="700">Devices (SSD, Disk, NIC)</text>
    </g>
  </g>
</svg>
